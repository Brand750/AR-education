<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Echo — AR</title>
  <link rel="stylesheet" href="app.css">
  <script src="vendor/aframe.min.js"></script>
  <script src="vendor/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <!-- Marker values 1, 2, 4 from the 3x3 Hamming set: every pair differs in four cells. -->
  <a-scene embedded
           arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3_HAMMING63; cameraParametersUrl: vendor/camera_para.dat; debugUIEnabled: false;"
           vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false"
           loading-screen="enabled: false"
           renderer="logarithmicDepthBuffer: true;">
    <!-- Models: built by models/src/build_models.py. Real size in metres, about 33 KB together. -->
    <a-assets timeout="8000">
      <a-asset-item id="m-sensor" src="models/sensor.glb"></a-asset-item>
      <a-asset-item id="m-car" src="models/car.glb"></a-asset-item>
    </a-assets>
    <a-marker id="sensor" type="barcode" value="1">
      <!-- The sensor's eyes face the top of the marker, the same way the pulse leaves. -->
      <a-entity class="model" gltf-model="#m-sensor"></a-entity>
      <!-- The pulse is attached to the sensor card, so it turns when the card turns. -->
      <a-entity id="pulse" visible="false">
        <a-ring id="pulse-out" rotation="-90 0 0" radius-inner="0.88" radius-outer="1"
                theta-start="-26" theta-length="52"
                material="shader: flat; color: #1f6fd0; side: double"></a-ring>
        <a-ring id="pulse-back" rotation="-90 0 0" radius-inner="0.88" radius-outer="1"
                theta-start="-26" theta-length="52"
                material="shader: flat; color: #e2622b; side: double"></a-ring>
      </a-entity>
    </a-marker>
    <a-marker id="car" type="barcode" value="2">
      <a-entity class="model" gltf-model="#m-car"></a-entity>
    </a-marker>
    <a-entity camera look-controls="enabled: false"></a-entity>
  </a-scene>

  <script src="core.js"></script>
  <script src="text.js"></script>
  <script src="log.js"></script>
  <script src="echo.js"></script>
  <script src="blind.js"></script>
  <script>
    // AR input: the car's position comes from the two tracked cards.
    const C = Core.CONFIG;
    const sensorEl = document.getElementById('sensor');
    const carEl = document.getElementById('car');
    const pulseEl = document.getElementById('pulse');
    const outEl = document.getElementById('pulse-out');
    const backEl = document.getElementById('pulse-back');
    const v = new THREE.Vector3(), q = new THREE.Quaternion();

    // Models are in metres; one marker unit is MARKER_CM wide. Add ?models=0 to hide them.
    const showModels = new URLSearchParams(location.search).get('models') !== '0';
    document.querySelectorAll('.model').forEach((el) => {
      const k = 100 / C.MARKER_CM;
      el.object3D.scale.set(k, k, k);
      el.object3D.visible = showModels;
    });

    function read() {
      const s = sensorEl.object3D, c = carEl.object3D;
      const state = {
        sensorSeen: s.visible, carSeen: c.visible, forward: 0, sideways: 0,
        centreForward: 0, centreSideways: 0,   // direction only; the Blind spot step uses it
      };
      if (state.sensorSeen && state.carSeen) {
        // Car position as seen from the sensor card. Height (y) is ignored: both cards lie flat.
        v.copy(c.position).sub(s.position).applyQuaternion(q.copy(s.quaternion).invert());
        const shown = Core.fromTracked(-v.z, v.x);   // forward = towards the top of the marker
        state.forward = shown.forward;
        state.sideways = shown.sideways;
        state.centreForward = -v.z;
        state.centreSideways = v.x;
      }
      return state;
    }

    // Blind spot step only. Both shapes are made the first time that step asks for them,
    // so the Echo step's scene stays as it was.
    const EDGE = C.CARD_CM / 2 / C.MARKER_CM;   // card edge, in marker units from the card centre
    let coneEl = null, conePulseEl = null;

    function ring(parent, half, inner, outer, material) {
      const el = document.createElement('a-ring');
      el.setAttribute('rotation', '-90 0 0');
      el.setAttribute('radius-inner', inner);
      el.setAttribute('radius-outer', outer);
      el.setAttribute('theta-start', -half);
      el.setAttribute('theta-length', 2 * half);
      el.setAttribute('material', material);
      parent.appendChild(el);
      return el;
    }

    // The area the sensor hears, lying flat on the desk in front of the sensor card.
    function showCone(cone) {
      if (!cone) { if (coneEl) coneEl.object3D.visible = false; return; }
      if (!coneEl) {
        coneEl = document.createElement('a-entity');
        coneEl.setAttribute('position', '0 0.01 0');
        coneEl.setAttribute('rotation', '0 90 0');   // the ring's middle points at the top of the marker
        ring(coneEl, cone.halfDeg, EDGE, EDGE + cone.rangeCm / C.SCALE / C.MARKER_CM,
             'shader: flat; color: #1f6fd0; opacity: 0.22; transparent: true; depthWrite: false; side: double');
        sensorEl.appendChild(coneEl);
        conePulseEl = ring(pulseEl, cone.halfDeg, 0.88, 1, 'shader: flat; color: #1f6fd0; side: double');
      }
      coneEl.object3D.visible = true;
    }

    // The outgoing sound fills the cone, wherever the car is.
    function drawConePulse(along, cone) {
      const size = EDGE + (along * cone.reachCm) / C.SCALE / C.MARKER_CM;
      const o = pulseEl.object3D;
      o.position.set(0, 0.02, 0);
      o.rotation.set(0, Math.PI / 2, 0);
      o.scale.set(size, size, size);
      o.visible = true;
      conePulseEl.object3D.visible = true;
      outEl.object3D.visible = false;
      backEl.object3D.visible = false;
    }

    function draw(view) {
      const p = view.pulse;
      if (view.cone || coneEl) {
        showCone(view.cone);
        if (view.cone && p && p.leg === 'out') return drawConePulse(p.along, view.cone);
        if (conePulseEl) conePulseEl.object3D.visible = false;
      }
      if (!p || p.leg === 'rest' || !view.cm) { pulseEl.object3D.visible = false; return; }
      // Back from shown cm to marker units on the sensor card.
      const gap = view.cm / C.SCALE / C.MARKER_CM;
      const edge = C.CARD_CM / 2 / C.MARKER_CM;
      const ux = view.sideways / view.cm, uz = -view.forward / view.cm;
      const out = p.leg === 'out';
      const from = out ? edge : edge + gap;                       // sensor edge, or car edge
      const size = Math.max(0.001, (out ? p.along : 1 - p.along) * gap);
      const o = pulseEl.object3D;
      o.position.set(ux * from, 0.02, uz * from);
      o.rotation.set(0, Math.atan2(-uz, ux) + (out ? 0 : Math.PI), 0);
      o.scale.set(size, size, size);
      o.visible = true;
      outEl.object3D.visible = out;
      backEl.object3D.visible = !out;
    }

    // Echo by default; add ?step=blind for the Blind spot step.
    const Step = new URLSearchParams(location.search).get('step') === 'blind' ? BlindStep : EchoStep;
    Step.start({ mode: 'ar', read, draw });
  </script>
</body>
</html>
